# Defaults; the tf-dt-gke-gateway-tls module overrides these via the helm_release
# values. Standalone `helm template` works with these for linting.
gatewayName: match-gateway
gatewayClassName: gke-l7-global-external-managed
allowedRoutesFrom: Same
enableTLS: true
hostname: ""
tlsSecretName: match-tls
staticIpName: ""

clusterIssuer:
  name: letsencrypt-prod
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
  acmeEmail: ""

cloudflare:
  apiToken: ""
  namespace: cert-manager
  tokenSecretName: cloudflare-api-token
  tokenSecretKey: api-token
