apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayName }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  {{- if and .Values.enableTLS .Values.staticIpName }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.staticIpName }}
  {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: {{ .Values.allowedRoutesFrom }}
    {{- if .Values.enableTLS }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ required "hostname is required when enableTLS" .Values.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.allowedRoutesFrom }}
    {{- end }}
{{- if .Values.enableTLS }}
---
# Cloudflare API token for the DNS-01 solver, in the cert-manager namespace so the
# controller can read it (cross-namespace from this release's namespace).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cloudflare.tokenSecretName }}
  namespace: {{ .Values.cloudflare.namespace }}
type: Opaque
stringData:
  {{ .Values.cloudflare.tokenSecretKey }}: {{ required "cloudflare.apiToken is required when enableTLS" .Values.cloudflare.apiToken | quote }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    server: {{ .Values.clusterIssuer.acmeServer }}
    email: {{ required "clusterIssuer.acmeEmail is required when enableTLS" .Values.clusterIssuer.acmeEmail }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.cloudflare.tokenSecretName }}
              key: {{ .Values.cloudflare.tokenSecretKey }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tlsSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.tlsSecretName }}
  issuerRef:
    name: {{ .Values.clusterIssuer.name }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.hostname | quote }}
{{- end }}
